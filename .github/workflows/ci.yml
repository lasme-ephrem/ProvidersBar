# Intégration continue Lasmium TOKENS-HUB — Windows x64 uniquement.
#
# Workflow unique (l'ancien quality.yml, qui répétait les mêmes commandes sur un
# second runner, a été fusionné ici). Deux jobs :
#   1. « tests »      : garde-fous déterministes et bloquants — syntaxe (verify,
#                       lint), tests unitaires, canary hors ligne des connecteurs
#                       (packs signés embarqués, sans clé ni réseau) et audit des
#                       dépendances de production. Ce job doit rester vert.
#   2. « smoke-electron » : tests d'intégration Electron/Playwright. Ils lancent de
#                       vraies fenêtres Chromium et dépendent d'une session graphique
#                       Windows interactive (et de DPAPI pour le chiffrement des clés).
#                       Ils sont donc marqués « best-effort » (continue-on-error) :
#                       un échec est visible, conservé en artefact, mais ne bloque pas
#                       la fusion. La validation release les exécute manuellement sur
#                       une machine Windows interactive avant `npm run package:release`.
#
# La fabrication, la vérification et la publication d'une version sont dans
# release.yml ; le canary avec clés réelles, déclenché à la main, dans
# canary-live.yml.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Moindre privilège : la CI lit le dépôt et n'écrit rien sur GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  CI: 'true'

jobs:
  tests:
    name: Tests unitaires et vérifications (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Actions épinglées sur leur majeure v7, exécutée sous Node 24 : les v4
      # reposaient sur Node 20, déprécié sur les runners hébergés.
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      # Chaque étape reste une simple commande npm, sans script PowerShell
      # inline : PowerShell 7 traite les guillemets typographiques (apostrophes
      # et guillemets courbes) comme des délimiteurs de chaîne, et une apostrophe
      # courbe dans un Write-Host a déjà rendu ce job rouge.
      # tests/quality.test.cjs les interdit désormais.
      - name: Vérifier la syntaxe
        run: npm run verify

      - name: Linter
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # Sans clé ni réseau : vérifie les packs de connecteurs signés embarqués et
      # leurs invariants. Le canary avec clés réelles vit dans canary-live.yml.
      - name: Canary hors ligne des connecteurs
        run: npm run connectors:canary

      # Les tests transverses écrivent uniquement dans des dossiers temporaires,
      # mais un échec des migrations/packaging peut laisser des traces utiles.
      - name: Conserver les traces de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Audit restreint aux dépendances de production : Electron/Playwright sont
      # des dépendances de développement et n'embarquent pas dans le portable.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev

  smoke-electron:
    name: Smoke Electron (best-effort, session graphique requise)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    # Voir le commentaire d'en-tête : un échec de ce job ne doit pas bloquer la
    # fusion, mais il reste visible dans l'onglet Actions et dans les artefacts.
    continue-on-error: true
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Intégration Electron — inventaire, IPC, chiffrement, widget
        continue-on-error: true
        run: npm run test:desktop

      - name: Ressources et niveaux visuels (deux thèmes)
        continue-on-error: true
        run: npm run test:resources:desktop

      - name: Claude — pannes, reprise, persistance du mode direct
        continue-on-error: true
        run: npm run test:claude:desktop

      - name: Conserver captures et résultats des smoke tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
